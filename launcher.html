<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>CRM 3CX — Avvio</title>
  <style>
    body { font-family: sans-serif; display: flex; justify-content: center;
           align-items: center; height: 100vh; margin: 0; background: #1a1a2e; color: #eee; }
    .box { text-align: center; }
    .spinner { width: 48px; height: 48px; border: 5px solid #444;
               border-top-color: #4f8ef7; border-radius: 50%;
               animation: spin 0.8s linear infinite; margin: 0 auto 16px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    p { color: #aaa; font-size: 14px; }
  </style>
</head>
<body>
  <div class="box">
    <div class="spinner"></div>
    <p id="msg">Apertura scheda cliente…</p>
  </div>
  <script>
    const params = new URLSearchParams(window.location.search);
    const number = params.get("number") || "";

    if (!number) {
      document.getElementById("msg").textContent = "Numero non ricevuto da 3CX.";
    } else {
      // Apre la pagina principale in una nuova finestra: larghezza fissa, altezza massima dello schermo
      const w = 600;
      const h = screen.availHeight - 90;               // 90 = barra del titolo/indirizzo della finestra (regola se serve)
      const left = Math.round(screen.availWidth / 2 - w / 2);
      const top  = screen.availTop || 0;
      const features = `width=${w},height=${h},left=${left},top=${top},resizable=yes,scrollbars=yes`;
      // Inoltra anche l'interno dell'operatore (ext) se presente
      const ext = params.get("ext") || params.get("agent") || "";
      const dest = `index.html?number=${encodeURIComponent(number)}`
                 + (ext ? `&ext=${encodeURIComponent(ext)}` : "");
      window.open(dest, "_blank", features);

      // Chiudi questa finestra dopo un attimo
      setTimeout(() => window.close(), 800);
    }
  </script>
</body>
</html>

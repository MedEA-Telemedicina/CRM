<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>CRM 3CX — Avvio</title>
  <style>
    body { font-family: sans-serif; display: flex; justify-content: center;
           align-items: center; height: 100vh; margin: 0; background: #1a1a2e; color: #eee; }
    .box { text-align: center; }
    .spinner { width: 48px; height: 48px; border: 5px solid #444;
               border-top-color: #4f8ef7; border-radius: 50%;
               animation: spin 0.8s linear infinite; margin: 0 auto 16px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    p { color: #aaa; font-size: 14px; }
    a { color: #4f8ef7; font-weight: bold; font-size: 15px; }
  </style>
</head>
<body>
  <div class="box">
    <div class="spinner" id="spin"></div>
    <p id="msg">Apertura scheda cliente…</p>
  </div>
  <script>
    const params = new URLSearchParams(window.location.search);
    const number = params.get("number") || "";

    if (!number) {
      document.getElementById("msg").textContent = "Numero non ricevuto da 3CX.";
      document.getElementById("spin").style.display = "none";
    } else {
      const w = 720, h = 940;
      const left = Math.round(screen.width / 2 - w / 2);
      const top  = Math.round(screen.height / 2 - h / 2);
      const features = `width=${w},height=${h},left=${left},top=${top},resizable=yes,scrollbars=yes`;
      const dest = "index.html?number=" + encodeURIComponent(number);

      const win = window.open(dest, "_blank", features);

      if (!win || win.closed) {
        // Popup bloccato dal browser → mostra link manuale
        document.getElementById("spin").style.display = "none";
        document.getElementById("msg").innerHTML =
          "⚠️ Popup bloccato.<br><br><a href='" + dest + "' target='_blank'>Clicca qui per aprire</a>";
      } else {
        setTimeout(() => window.close(), 800);
      }
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Launcher CRM 3CX</title>
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;margin:0;padding:18px;background:#0b1020;color:#e9ecf1}
    .muted{color:#a8b0c2}
    code{background:rgba(255,255,255,.08);padding:2px 6px;border-radius:8px}
  </style>
</head>
<body>
  <h1>Launcher CRM 3CX</h1>
  <p class="muted">Apre/riusa una sola finestra <code>index.html</code> e le invia il numero (così non apre nuove tab).</p>
  <p class="muted">Se non succede nulla, abilita i popup per questo dominio.</p>

<script>
  function normalize(n){
    if(!n) return '';
    const cleaned = n.replace(/\s+/g,'');
    if(cleaned.startsWith('00')) return '+' + cleaned.slice(2);
    return cleaned;
  }

  const params = new URLSearchParams(window.location.search);
  const number = normalize(params.get('number') || '');

  const base = window.location.origin + window.location.pathname.replace(/launcher\.html$/,'');
  const indexUrl = base + 'index.html' + (number ? ('?number=' + encodeURIComponent(number)) : '');

  window.open(indexUrl, 'CRM3CX');

  try {
    const channel = new BroadcastChannel('crm3cx');
    channel.postMessage({ type: 'call', number });
    setTimeout(() => channel.close(), 100);
  } catch(e) {}

  setTimeout(() => window.close(), 300);
  setTimeout(() => {
    document.body.insertAdjacentHTML('beforeend', '<p class="muted">Puoi chiudere questa finestra. La scheda CRM è stata aggiornata.</p>');
  }, 400);
</script>
</body>
</html>
